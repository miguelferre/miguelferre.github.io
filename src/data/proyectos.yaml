- id: climatch
  tipo: exploracion
  nombre: Climatch
  pregunta:
    es: ¿Qué ciudad tiene el clima que quiero, hoy y en 2050?
    en: Which city has the climate I want, today and in 2050?
  resumen:
    es: >-
      Una web que compara el clima real de cualquier ciudad del mundo, hoy y en 2050, para encontrar la que se parece al clima que buscas.
    en: >-
      A website that compares the real climate of any city in the world, today and in 2050, to find the one that matches the climate you want.
  estado: live
  url_live: https://climatch.app
  captura: /capturas/climatch.webp
  figura: climatch
  metricas:
    - valor: "86"
      etiqueta: { es: "años de clima ERA5", en: "years of ERA5 climate" }
  inicio: 2026
  como:
    es:
      - TypeScript, Astro 5 y React 19 en islas; SVG propio con micro-módulos de d3
      - "Datos: Open-Meteo/ERA5 (1940-2025), CMIP6 con tres modelos y método delta, NOAA, Banco Mundial, OCDE, Ookla"
      - Cloudflare Workers, Vitest y Playwright, accesibilidad comprobada con Axe
      - Bilingüe EN y ES, SEO programático, 8 ADRs
    en:
      - TypeScript, Astro 5 and React 19 islands; custom SVG with d3 micro-modules
      - "Data: Open-Meteo/ERA5 (1940-2025), CMIP6 with three models and the delta method, NOAA, World Bank, OECD, Ookla"
      - Cloudflare Workers, Vitest and Playwright, accessibility checked with Axe
      - Bilingual EN and ES, programmatic SEO, 8 ADRs
  nota_codigo:
    es: El repositorio es privado; se enseña bajo petición.
    en: The repository is private; available on request.
