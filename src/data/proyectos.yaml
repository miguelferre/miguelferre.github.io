# Fuente de datos del portfolio. Solo lo enlazable.
# La fuente de verdad ampliada vive en el repo privado (portfolio/PROYECTOS.md);
# cuando cambie algo allí, se refleja aquí a mano.
#
# Los textos van en los dos idiomas: { es: ..., en: ... }.
#
# tipo: herramienta (bloque destacado en la portada) | exploracion (tarjeta)
#
# estado: live | repo | privado
#   live    -> hay producto desplegado (url_live obligatoria)
#   repo    -> solo código público (url_repo obligatoria); estado_nota explica qué falta
#   privado -> se enseña en conversación

- id: vigia
  tipo: herramienta
  nombre: Vigía
  pregunta:
    es: Una herramienta para vigilar modelos de IA en producción, pensada para usarla con un asistente de IA por MCP.
    en: A tool to monitor AI models in production, built to be run with an AI assistant over MCP.
  resumen:
    es: >-
      Mide la calidad, la equidad entre grupos, la deriva y la explicabilidad de un modelo
      con datos tabulares. Añade la capa humana: deskilling, overrides y auditoría de la
      interacción. Un asistente de IA la opera por MCP con 39 herramientas, y todo lo que hace
      queda en el diario. Herramienta local para Windows, sin código.
    en: >-
      It measures quality, fairness across groups, drift and explainability for a model
      on tabular data. It adds the human layer: deskilling, overrides and an audit of the
      interaction. An AI assistant runs it over MCP with 39 tools, and everything it does
      goes into the log. A local, no-code Windows tool.
  # Al publicar el repo: estado repo.
  estado: privado
  url_repo: https://github.com/miguelferre/vigia
  url_descarga: https://github.com/miguelferre/vigia/releases/latest
  captura: /capturas/vigia.webp
  figura: vigia
  captura_alt:
    es: Cuadro de mando de Vigía con datos sintéticos
    en: Vigía dashboard with synthetic data
  metricas:
    - valor: "39"
      etiqueta: { es: "herramientas MCP", en: "MCP tools" }
    - valor: "3"
      etiqueta: { es: "tipos de tarea", en: "task types" }
    - valor: "7"
      etiqueta: { es: "plantillas sintéticas", en: "synthetic templates" }

- id: curso
  tipo: herramienta
  nombre: Seguridad y gobernanza de la IA
  pregunta:
    es: Un curso de seguridad y gobernanza de la IA, en español.
    en: An AI safety and governance course, in Spanish.
  resumen:
    es: >-
      Adapta al español el libro y el curso de seguridad de la IA del Center for AI Safety
      (CAIS), con su permiso. Añade casos de sanidad y un módulo de monitorización con Vigía
      como laboratorio. Se estudia en el navegador.
    en: >-
      A Spanish adaptation of the AI safety book and course by the Center for AI Safety
      (CAIS), with their permission. It adds healthcare cases and a monitoring module with
      Vigía as the lab. It runs in the browser.
  # Al publicar el repo y activar Pages desde docs/: estado live.
  estado: privado
  url_live: https://miguelferre.github.io/curso-seguridad-y-gobernanza-ia/
  url_repo: https://github.com/miguelferre/curso-seguridad-y-gobernanza-ia
  captura: /capturas/curso.webp
  figura: curso
  captura_alt:
    es: Portada del curso de seguridad y gobernanza de la IA
    en: Home page of the AI safety and governance course
  metricas:
    - valor: "57"
      etiqueta: { es: "lecciones", en: "lessons" }
    - valor: "75"
      etiqueta: { es: "simuladores", en: "simulators" }
    - valor: "≈40 h"
      etiqueta: { es: "de estudio", en: "of study" }
  nota_codigo:
    es: Reproduced with permission of Center for AI Safety, Inc.
    en: Reproduced with permission of Center for AI Safety, Inc.

- id: madrid-hli
  tipo: exploracion
  nombre: Madrid Healthy Living Index
  pregunta:
    es: ¿Es igual de fácil llevar una vida saludable en todos los barrios de Madrid?
    en: Is healthy living equally easy in every Madrid neighbourhood?
  resumen:
    es: >-
      Un índice de vida saludable para cada barrio de Madrid, hecho con datos abiertos: comida sana, deporte, parques y arbolado. Se consulta en un dashboard interactivo.
    en: >-
      A healthy-living index for every Madrid neighbourhood, built from open data: healthy food, sport, parks and tree cover. You explore it in an interactive dashboard.
  estado: live
  url_live: https://miguelferre.github.io/Madrid_HLI/
  url_repo: https://github.com/miguelferre/Madrid_HLI
  captura: /capturas/madrid-hli.webp
  figura: madrid-hli
  metricas:
    - valor: "9 %"
      etiqueta: { es: "de barrios cumplen 3-30-300", en: "of neighbourhoods meet 3-30-300" }
  inicio: 2026
  intro:
    es: >-
      Un índice compuesto de vida saludable por barrio. Los barrios del sur, de renta más baja,
      puntúan mejor que los del norte; solo el 9 % de los barrios cumple la regla 3-30-300.
    en: >-
      A composite healthy-living index by neighbourhood. The lower-income southern neighbourhoods
      score better than the northern ones; only 9% of neighbourhoods meet the 3-30-300 rule.
  como:
    es:
      - R con terra, sf y dodgr; isócronas sobre 605.000 vértices
      - Regla 3-30-300 de acceso al verde urbano
      - Dashboard shinylive (WebAssembly) servido desde GitHub Pages
    en:
      - R with terra, sf and dodgr; isochrones over 605,000 vertices
      - The 3-30-300 rule for access to urban green
      - shinylive (WebAssembly) dashboard served from GitHub Pages

- id: storymap-incendios
  tipo: exploracion
  nombre: Storymap incendios Galicia 2025
  pregunta:
    es: ¿Por qué ardió tanto Galicia en 2025?
    en: Why did so much of Galicia burn in 2025?
  resumen:
    es: >-
      Un relato con mapas, capítulo a capítulo, de los incendios de 2025 en Galicia: dónde ardió, cuánto y con qué severidad, medido con imágenes de satélite.
    en: >-
      A map story, chapter by chapter, of the 2025 wildfires in Galicia: where it burned, how much and how severely, measured from satellite images.
  estado: live
  url_live: https://miguelferre.github.io/STORYMAP_INCENDIOS_GALICIA_2025/
  url_repo: https://github.com/miguelferre/STORYMAP_INCENDIOS_GALICIA_2025
  captura: /capturas/storymap-incendios.webp
  figura: storymap-incendios
  metricas:
    - valor: "1.400"
      etiqueta: { es: "incendios", en: "fires" }
  inicio: 2025
  intro:
    es: >-
      Empecé en agosto de 2025, durante los incendios. Un storymap de nueve capítulos:
      1.400 incendios y el mayor registrado en Galicia, Larouco-Seadur, 31.778 ha.
    en: >-
      I started in August 2025, while the fires were still burning. A nine-chapter storymap:
      1,400 fires and the largest ever recorded in Galicia, Larouco-Seadur, 31,778 ha.
  como:
    es:
      - Sentinel-2 vía Microsoft Planetary Computer, severidad por dNBR
      - 21 pasos de procesado con geopandas, rasterio y xarray
      - Mapbox GL JS, scrollytelling, ES y GL
      - 69 commits, en solitario, de la ingesta al despliegue en Pages
    en:
      - Sentinel-2 via Microsoft Planetary Computer, burn severity by dNBR
      - 21 processing steps with geopandas, rasterio and xarray
      - Mapbox GL JS, scrollytelling, ES and GL
      - 69 commits, solo, from ingestion to deployment on Pages

